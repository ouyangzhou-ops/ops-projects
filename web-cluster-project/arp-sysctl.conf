# RS 后端 ARP 抑制配置（DR 模式必需）
# 放置位置：/etc/sysctl.d/arp.conf  生效：sysctl -p /etc/sysctl.d/arp.conf
# arp_ignore=1    只回答目标 IP 是本接口地址的 ARP 请求（不响应 VIP 的请求）
# arp_announce=2  发送 ARP 通告时使用能路由到目标的最佳本地地址（不对外宣告 VIP）
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.lo.arp_ignore = 1
net.ipv4.conf.lo.arp_announce = 2
